name: find-images
on:
  push:
    branches: [image-research]
    paths: [tools/find_images.py, tools/run.env, tools/picks.json, tools/pool.json, .github/workflows/find-images.yml]
permissions:
  contents: write
jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - run: |
          set -a; . tools/run.env; set +a
          python3 tools/find_images.py
      - run: |
          git config user.name "image-research-bot"
          git config user.email "actions@github.com"
          git add tools/out
          git commit -m "Image research results" && git pull --rebase && git push
